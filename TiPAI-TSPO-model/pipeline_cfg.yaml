# Pipeline configuration for run_tournament_pipeline.py
# Edit paths and values to match your environment.

model: runwayml/stable-diffusion-v1-5
diffusion_steps: 50

# Number of stops to audit in the last 30% of the denoising schedule
n_checks: 3

# Number of candidate suggestions per tournament
candidates: 5

# Adversarial threshold (auditor.adversarial_score >= adv_threshold triggers tournament)
adv_threshold: 0.15

# Path to inpainter weights (optional). If omitted, inpaint pipeline default weights are used.
inpainter_pth: ../Tournamnet-Training/checkpoints/your_inpainter.pth

# Policy checkpoint (required)
policy_checkpoint: ../Tournamnet-Training/checkpoints/tspo_out/tspo_step00150.pth

# State encoder checkpoint (optional; required if you want the script to build the 257-d state)
state_enc_checkpoint: ../Tournamnet-Training/checkpoints/tspo_out/state_enc_step00150.pth

# Auditor model + vocab (defaults from training repo)
auditor_model: ../Tournamnet-Training/checkpoints/complete_auditor_best.pth
auditor_vocab: ../Tournamnet-Training/checkpoints/vocab.json

# Output image path
output_image: pipeline_out.png

# Device: 'auto'|'cuda'|'cpu'
device: auto

# Misc
seed: 42
